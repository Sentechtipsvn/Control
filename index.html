<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Control Center - Sentechtipvn</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Center">
    <link rel="apple-touch-icon-precomposed" href="icon.png" />

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1 id="app-title" class="main-title" data-key="app_title">Control Center</h1>

    <div class="grid-container">
        <div class="btn-action" data-key="1" data-id="1" onclick="toggleActiveAndRun(this, '1')">
            <img src="images/assistivetouch.png" alt="AssistiveTouch">
            <span class="btn-label">AssistiveTouch</span>
        </div>
        <div class="btn-action" data-key="2" data-id="2" onclick="toggleActiveAndRun(this, '2')">
            <img src="images/airplane.png" alt="Chế độ máy bay">
            <span class="btn-label">Chế độ máy bay</span>
        </div>
        <div class="btn-action" data-key="3" data-id="3" onclick="toggleActiveAndRun(this, '3')">
            <img src="images/vpn.png" alt="VPN">
            <span class="btn-label">VPN</span>
        </div>
        <div class="btn-action" data-key="4" data-id="4" onclick="toggleActiveAndRun(this, '4')">
            <img src="images/wifi.png" alt="Wi-Fi">
            <span class="btn-label">Wi-Fi</span>
        </div>
        <div class="btn-action" data-key="5" data-id="5" onclick="toggleActiveAndRun(this, '5')">
            <img src="images/bluetooth.png" alt="Bluetooth">
            <span class="btn-label">Bluetooth</span>
        </div>
        <div class="btn-action" data-key="6" data-id="6" onclick="toggleActiveAndRun(this, '6')">
            <img src="images/5g.png" alt="5G">
            <span class="btn-label">5G</span>
        </div>
        <div class="btn-action" data-key="7" data-id="7" onclick="toggleActiveAndRun(this, '7')">
            <img src="images/location.png" alt="Dịch vụ định vị">
            <span class="btn-label">Dịch vụ định vị</span>
        </div>
        <div class="btn-action" data-key="8" data-id="8" onclick="toggleActiveAndRun(this, '8')">
            <img src="images/dnd.png" alt="Không làm phiền">
            <span class="btn-label">Không làm phiền</span>
        </div>
        <div class="btn-action" data-key="9" data-id="9" onclick="toggleActiveAndRun(this, '9')">
            <img src="images/hotspot.png" alt="Phát Wi-Fi">
            <span class="btn-label">Phát Wi-Fi</span>
        </div>
        <div class="btn-action" data-key="10" data-id="10" onclick="toggleActiveAndRun(this, '10')">
            <img src="images/battery.png" alt="Pin yếu">
            <span class="btn-label">Pin yếu</span>
        </div>
        <div class="btn-action" data-key="11" data-id="11" onclick="toggleActiveAndRun(this, '11')">
            <img src="images/volume.png" alt="Âm lượng">
            <span class="btn-label">Âm lượng</span>
        </div>
        <div class="btn-action" data-key="12" data-id="12" onclick="toggleActiveAndRun(this, '12')">
            <img src="images/flashlight.png" alt="Đèn pin">
            <span class="btn-label">Đèn pin</span>
        </div>
        <div class="btn-action" data-key="13" data-id="13" onclick="toggleActiveAndRun(this, '13')">
            <img src="images/restart.png" alt="Khởi động lại">
            <span class="btn-label">Khởi động lại</span>
        </div>
        <div class="btn-action" data-key="14" data-id="14" onclick="toggleActiveAndRun(this, '14')">
            <img src="images/shutdown.png" alt="Tắt máy">
            <span class="btn-label">Tắt máy</span>
        </div>
    </div>

    <button class="settings-btn" id="open-settings" aria-label="Settings">
        <img src="icons/icon-setting.png" alt="Settings">
    </button>

    <div class="settings-panel" id="settings-panel">
        <div class="settings-header">
            <h2 data-key="settings_title">Cài đặt</h2>
            <button id="close-settings" class="close-btn">&times;</button>
        </div>
        <div class="settings-body">
            <div class="setting-group">
                <label data-key="setting_bg_color">Màu nền hệ thống</label>
                <input type="color" id="stt-bg-color" value="#0b1120">
            </div>
            <div class="setting-group">
                <label data-key="setting_card_bg">Màu nền khung nút</label>
                <input type="color" id="stt-card-bg" value="#333333">
            </div>
            <div class="setting-group">
                <label data-key="setting_title_color">Màu chữ tiêu đề</label>
                <input type="color" id="stt-title-color" value="#ffffff">
            </div>
            <div class="setting-group">
                <label data-key="setting_label_color">Màu chữ nút bấm</label>
                <input type="color" id="stt-label-color" value="#ffffff">
            </div>
            <div class="setting-group">
                <label class="toggle-label">
                    <span class="toggle-text" data-key="setting_card_shadow">Bật đổ bóng khung nút</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="stt-card-shadow-toggle">
                        <span class="slider"></span>
                    </div>
                </label>
            </div>
            <div class="setting-group">
                <label class="toggle-label">
                    <span class="toggle-text" data-key="setting_icon_shadow">Bật đổ bóng icon (55x55)</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="stt-icon-shadow-toggle">
                        <span class="slider"></span>
                    </div>
                </label>
            </div>
            
            <div class="shadow-controls">
                <h3 data-key="setting_shadow_title">Tùy chỉnh Đổ bóng</h3>
                <div class="setting-group">
                    <label>X offset: <span id="val-shadow-x">0</span>px</label>
                    <input type="range" id="shadow-x" min="-50" max="50" value="0">
                </div>
                <div class="setting-group">
                    <label>Y offset: <span id="val-shadow-y">4</span>px</label>
                    <input type="range" id="shadow-y" min="-50" max="50" value="4">
                </div>
                <div class="setting-group">
                    <label>Blur: <span id="val-shadow-blur">10</span>px</label>
                    <input type="range" id="shadow-blur" min="0" max="100" value="10">
                </div>
                <div class="setting-group">
                    <label>Spread: <span id="val-shadow-spread">0</span>px</label>
                    <input type="range" id="shadow-spread" min="-20" max="50" value="0">
                </div>
                <div class="setting-group">
                    <label data-key="setting_shadow_color">Màu bóng thủ công</label>
                    <input type="color" id="shadow-color" value="#000000">
                </div>
            </div>

            <div class="settings-actions">
                <button id="btn-save-settings" class="btn-primary" data-key="btn_save">Lưu cấu hình</button>
                <div class="action-row">
                    <button id="btn-export-settings" class="btn-secondary" data-key="btn_export">📤 Xuất</button>
                    <button id="btn-import-settings" class="btn-secondary" data-key="btn_import">📥 Nhập</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="toast-notification">Đã lưu cấu hình</div>

    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Control Center</title>

    <!-- Cấu hình WebClip iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Center">

    <!-- Đã cập nhật đường dẫn tới tệp icon.png cùng thư mục -->
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-top: calc(env(safe-area-inset-top) + 20px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
            padding-left: 20px;
            padding-right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-action img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn-action span {
            font-size: 0.95rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>Control Center</h1>

    <div class="grid-container">
        <div class="btn-action" onclick="runShortcut('wifi')">
            <img src="https://img.icons8.com/color/96/wifi--v1.png" alt="Wi-Fi">
            <span>Wi-Fi</span>
        </div>

        <div class="btn-action" onclick="runShortcut('bluetooth')">
            <img src="https://img.icons8.com/color/96/bluetooth.png" alt="Bluetooth">
            <span>Bluetooth</span>
        </div>

        <div class="btn-action" onclick="runShortcut('5g')">
            <img src="https://img.icons8.com/color/96/5g.png" alt="5G">
            <span>5G</span>
        </div>

        <div class="btn-action" onclick="runShortcut('flashlight')">
            <img src="https://img.icons8.com/color/96/flashlight.png" alt="Đèn pin">
            <span>Đèn pin</span>
        </div>

        <div class="btn-action" onclick="runShortcut('lowpower')">
            <img src="https://img.icons8.com/color/96/battery-level.png" alt="Pin yếu">
            <span>Pin yếu</span>
        </div>

        <div class="btn-action" onclick="runShortcut('restart')">
            <img src="https://img.icons8.com/color/96/restart.png" alt="Khởi động lại">
            <span>Khởi động lại</span>
        </div>
    </div>

    <script>
        const SHORTCUT_NAME = "Control Center";

        function runShortcut(actionName) {
            const url = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=${encodeURIComponent(actionName)}`;
            window.location.href = url;
        }
    </script>
</body>
</html>
